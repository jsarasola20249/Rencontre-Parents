<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="rencontre.ESCO">
  <title>rencontre.ESCO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; min-height: 100%; background-color: #f3efe4; background-image: radial-gradient(rgba(28, 25, 21, 0.045) 0.6px, transparent 0.7px); background-size: 5px 5px; color: #1c1915; font: 16px/1.45 "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
    main { max-width: 38rem; }
    h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: -0.04em; }
    p { margin: 0 0 12px; }
    a {
      display: inline-block;
      margin-top: 8px;
      background: #1c1915;
      color: #f3efe4;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 18px;
    }
    .note { color: #5c564c; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>rencontre.ESCO</h1>
    <p id="consigne">La fiche s’ouvre dans cet onglet, avec le compte Google qui a publié l’application. Si Chrome en a plusieurs, choisissez celui de l’enseignant.</p>
    <p><a id="ouvrir" href="#">Ouvrir l’application</a></p>
    <p class="note">Pour l’installer : menu du navigateur, Installer, ou Ajouter à l’écran d’accueil.</p>
  </main>
  <script>
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyeT77dfvDwtHmGrq0sOaEKTrmGQP6tH7Ggcc9le7V3I7f5UhQGmUKZCsEpm0DgSYhe/exec';
    var lien = document.getElementById('ouvrir');
    var adresse = WEB_APP_URL.indexOf('REEMPLAZAR') === -1
      ? 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(WEB_APP_URL)
      : '';
    if (!adresse) {
      lien.hidden = true;
      document.getElementById('consigne').textContent = 'L’adresse de l’application n’est pas encore renseignée.';
    } else {
      lien.href = adresse;
      var installee = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if (installee) window.location.replace(adresse);
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
